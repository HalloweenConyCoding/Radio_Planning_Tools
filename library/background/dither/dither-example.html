<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cony Dither Example</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #050407;
      color: #f4efff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .dither-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #050407;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      align-items: center;
      padding: 48px;
      pointer-events: none;
    }

    .content {
      width: min(680px, 100%);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(40px, 8vw, 96px);
      line-height: 0.92;
      letter-spacing: 0;
    }

    p {
      max-width: 560px;
      margin: 0;
      color: rgba(244, 239, 255, 0.78);
      font-size: 18px;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div id="dither-bg" class="dither-bg"></div>

  <main class="page">
    <section class="content">
      <h1>Cony Dither</h1>
      <p>Move your cursor. This page calls the local vanilla JS library with no React, Vite, shadcn, npm, or server.</p>
    </section>
  </main>

  <script src="./dither-bg.js"></script>
  <script>
    ConyDither.create("#dither-bg", {
      waveColor: [0.8274509803921568, 0.7843137254901961, 1],
      enableMouseInteraction: true,
      mouseRadius: 0.9,
      colorNum: 4,
      pixelSize: 1,
      waveAmplitude: 0.35,
      waveFrequency: 7.5,
      waveSpeed: 0.05
    });
  </script>
</body>
</html>
