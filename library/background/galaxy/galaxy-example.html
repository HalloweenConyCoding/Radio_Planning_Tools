<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cony Galaxy Example</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #020207;
      color: #f5f2ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .galaxy-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #020207;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      align-items: center;
      padding: 48px;
      pointer-events: none;
    }

    .content {
      width: min(680px, 100%);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(40px, 8vw, 96px);
      line-height: 0.92;
      letter-spacing: 0;
    }

    p {
      max-width: 560px;
      margin: 0;
      color: rgba(245, 242, 255, 0.76);
      font-size: 18px;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div id="galaxy-bg" class="galaxy-bg"></div>

  <main class="page">
    <section class="content">
      <h1>Cony Galaxy</h1>
      <p>Move your cursor. This page calls the local vanilla JS Galaxy background with no React, OGL, Vite, shadcn, npm, or server.</p>
    </section>
  </main>

  <script src="./galaxy-bg.js"></script>
  <script>
    ConyGalaxy.create("#galaxy-bg", {
      starSpeed: 0,
      density: 1,
      hueShift: 30,
      speed: 0.6,
      glowIntensity: 0.2,
      saturation: 0.15,
      mouseRepulsion: true,
      repulsionStrength: 1,
      twinkleIntensity: 0.1,
      rotationSpeed: 0.1,
      transparent: false
    });
  </script>
</body>
</html>
