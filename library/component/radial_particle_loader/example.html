<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cony radial particle loader</title>
  <link rel="stylesheet" href="radial-particle-loader.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0c0f;
    }
  </style>
</head>
<body>

  </script>
</body>
</html>
