<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shiny Text - Vanilla Usage</title>
  <link rel="stylesheet" href="shiny_text.css">
  <style>
    body { margin: 40px; font: 16px system-ui, sans-serif; background: #101318; color: #d8dee9; }
    .demo { font-size: clamp(2rem, 6vw, 4.5rem); }
  </style>
</head>
<body>
  <div class="demo" data-shiny-text data-shiny-color="#b5b5b5" data-shiny-color-shine="#d0ffd9" data-shiny-speed="2.2" data-shiny-spread="110">Shiny Text Effect</div>
  <script src="shiny_text.js"></script>
</body>
</html>
